[workspace]
resolver = "2"
members = [
    "crates/athar-event",
    "crates/athar-storage",
    "crates/athar-audit",
    "crates/athar-governor",
    "crates/athar-lifecycle",
    "crates/athar-detection",
    "crates/athar-daemon",
    "crates/athar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = "2"
zstd = "0.13"
blake3 = "1"
ulid = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

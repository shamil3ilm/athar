name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- PHP: fast, no toolchain needed. Runs everything the shim ships. ----------
  php-tests:
    name: PHP shim tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sockets, pdo_sqlite, mbstring
          tools: none
          coverage: none

      - name: Verify PHP syntax on all shim files
        run: |
          find shim/src -name '*.php' -exec php -l {} + | tail -20
          find refapp -name '*.php' -exec php -l {} + | tail -10

      - run: php shim/bin/smoke-test.php
      - run: php shim/bin/e2e-test.php
      - run: php shim/bin/middleware-test.php
      - run: php shim/bin/eventmapper-test.php
      - run: php shim/bin/subscribers-test.php
      - run: php shim/bin/spool-test.php
      - run: php shim/bin/beneficiary-test.php
      - run: php shim/bin/evaluate-test.php

      # Performance check — measures shim observe() hot path.
      # Reports p50/p95/p99/max + throughput. On CI's shared runners this can
      # be noisy, so we WARN on budget breach and only fail at 5x tolerance.
      - name: Shim hot-path perf (PERF-1, PERF-2)
        run: php refapp/bin/perf-test.php --n=10000 --warmup=1000

  # -- Rust: build + test the workspace. This is the first time cargo has ever
  #    seen this code. Any compile error, missing trait bound, or lifetime issue
  #    surfaces here. --------------------------------------------------------
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: cargo build (all targets)
        working-directory: daemon
        run: cargo build --workspace --all-targets

      - name: cargo test
        working-directory: daemon
        run: cargo test --workspace --no-fail-fast

  # -- Integration: build the actual daemon binary, run it, drive the refapp
  #    simulator through it, then use the athar CLI to verify outputs. --------
  integration:
    name: End-to-end integration
    runs-on: ubuntu-latest
    needs: [rust-tests, php-tests]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          shared-key: integration

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sockets, pdo_sqlite

      - name: Build release binaries
        working-directory: daemon
        run: cargo build --release --bin athar-daemon --bin athar

      # Before starting the daemon: emit some frames to a NON-EXISTENT daemon so
      # the shim writes a coverage_gap spool file. On next boot the collector
      # will pick them up and turn them into audit-chain coverage_gap records.
      - name: Pre-flight — emit against unreachable daemon, verify spool
        env:
          ATHAR_DAEMON_HOST: 127.0.0.1
          ATHAR_DAEMON_PORT: '11224'  # nothing here yet
          ATHAR_TENANT_ID: tnt_ci
          ATHAR_CONNECT_TIMEOUT_MS: '50'
          ATHAR_SHIM_SPOOL_DIR: ${{ github.workspace }}/ci-spool
        run: |
          php refapp/bin/simulator.php --scenario=happy --count=1 || true
          ls -la ${{ github.workspace }}/ci-spool
          test -n "$(find ${{ github.workspace }}/ci-spool -name '*.jsonl' -type f 2>/dev/null)" \
            || (echo "FAIL: expected a spool file after failed emit"; exit 1)
          echo "shim spool file(s) present"

      - name: Start daemon
        env:
          ATHAR_DATA_DIR: ${{ github.workspace }}/ci-data
          ATHAR_STALENESS_SCAN_INTERVAL_SECS: '5'
          ATHAR_LISTEN_ADDR: 127.0.0.1:11223
          ATHAR_SHIM_SPOOL_DIR: ${{ github.workspace }}/ci-spool
          RUST_LOG: info
        run: |
          nohup daemon/target/release/athar-daemon > daemon.log 2>&1 &
          echo $! > daemon.pid
          # Wait for the daemon to bind. Poll up to 10s.
          for i in $(seq 1 20); do
            if ss -ltn 2>/dev/null | grep -q 11223; then
              echo "daemon listening on :11223 after ${i} attempts"
              break
            fi
            sleep 0.5
          done
          # Fail early if the daemon never bound.
          if ! ss -ltn 2>/dev/null | grep -q 11223; then
            echo "daemon failed to bind"
            cat daemon.log
            exit 1
          fi

      - name: Drive synthetic payment traffic through the shim
        env:
          ATHAR_DAEMON_HOST: 127.0.0.1
          ATHAR_DAEMON_PORT: '11223'
          ATHAR_TENANT_ID: tnt_ci
        run: php refapp/bin/simulator.php --scenario=all --seed=42

      - name: Also send the Eloquent-model demo through
        env:
          ATHAR_DAEMON_HOST: 127.0.0.1
          ATHAR_DAEMON_PORT: '11223'
          ATHAR_TENANT_ID: tnt_ci
        run: php refapp/bin/model-demo.php

      - name: Stop daemon cleanly (SIGINT → flush)
        run: |
          # Give the daemon a moment for any pending audit segment to close on shutdown.
          kill -INT "$(cat daemon.pid)" || true
          # Wait up to 10s for the process to exit.
          for i in $(seq 1 20); do
            if ! kill -0 "$(cat daemon.pid)" 2>/dev/null; then
              echo "daemon stopped after ${i} attempts"
              break
            fi
            sleep 0.5
          done
          echo "--- Daemon log tail: ---"
          tail -n 100 daemon.log || true

      - name: Verify daemon SQLite state
        run: php refapp/bin/verify.php --data-dir=${{ github.workspace }}/ci-data --tenant=tnt_ci

      - name: Verify shim-spool was consumed on startup
        # After the daemon booted, the collector should have drained the spool dir.
        # No .jsonl files should remain.
        run: |
          leftover=$(find ${{ github.workspace }}/ci-spool -name '*.jsonl' -type f 2>/dev/null | wc -l)
          echo "leftover spool files: $leftover"
          test "$leftover" = "0" || (echo "FAIL: spool files were not consumed"; ls -la ${{ github.workspace }}/ci-spool; exit 1)

      - name: athar audit verify — proves SEC-13 on real on-disk data
        run: daemon/target/release/athar audit verify ${{ github.workspace }}/ci-data/audit/segments

      - name: athar lifecycle list --open
        run: daemon/target/release/athar lifecycle list ${{ github.workspace }}/ci-data/state/lifecycles.db --open

      - name: athar decision recent
        run: daemon/target/release/athar decision recent ${{ github.workspace }}/ci-data/state/decisions.db --limit 30

      - name: Upload daemon log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-log
          path: |
            daemon.log
            ci-data/**/*
          if-no-files-found: warn
          retention-days: 7

  # -- Air-gapped: prove D10 — "no outbound sockets in the binary" — is a
  #    runtime property, not just an intent. Runs the whole stack with all
  #    outbound egress blocked at the iptables layer, except loopback.
  #    Verifies the daemon boots, ingests, correlates, decides, and produces
  #    the exact same outputs as the online integration job. --------------
  air-gapped:
    name: Air-gapped integration (D10, V0 criterion 13)
    runs-on: ubuntu-latest
    needs: [rust-tests, php-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          shared-key: integration
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sockets, pdo_sqlite

      - name: Build binaries (must happen BEFORE we block egress)
        working-directory: daemon
        run: cargo build --release --bin athar-daemon --bin athar

      - name: Air-gap the runner — accept loopback, reject everything else
        run: |
          sudo iptables-save > /tmp/iptables.pre-airgap
          # Loopback must stay open — shim ↔ daemon uses 127.0.0.1.
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          # Reject everything else with a fast fail (icmp-net-unreachable).
          sudo iptables -A OUTPUT -j REJECT --reject-with icmp-net-unreachable
          echo "--- OUTPUT chain: ---"
          sudo iptables -L OUTPUT -n -v

      - name: Confirm outbound is blocked
        run: |
          set +e
          # Any success here means the air-gap failed.
          if timeout 3 curl -sI https://example.com > /dev/null 2>&1; then
            echo "FAIL: outbound HTTPS is not blocked"
            exit 1
          fi
          if timeout 3 curl -sI http://8.8.8.8 > /dev/null 2>&1; then
            echo "FAIL: outbound HTTP is not blocked"
            exit 1
          fi
          echo "ok: outbound egress is blocked"

      - name: Start daemon under air-gap
        env:
          ATHAR_DATA_DIR: ${{ github.workspace }}/airgap-data
          ATHAR_LISTEN_ADDR: 127.0.0.1:11225
          ATHAR_STALENESS_SCAN_INTERVAL_SECS: '5'
          RUST_LOG: info
        run: |
          nohup daemon/target/release/athar-daemon > airgap-daemon.log 2>&1 &
          echo $! > airgap.pid
          for i in $(seq 1 20); do
            if ss -ltn 2>/dev/null | grep -q 11225; then
              echo "daemon listening on :11225 after ${i} attempts"
              break
            fi
            sleep 0.5
          done
          if ! ss -ltn 2>/dev/null | grep -q 11225; then
            echo "daemon failed to bind"
            cat airgap-daemon.log
            exit 1
          fi

      - name: Drive synthetic traffic under air-gap
        env:
          ATHAR_DAEMON_HOST: 127.0.0.1
          ATHAR_DAEMON_PORT: '11225'
          ATHAR_TENANT_ID: tnt_airgap
        run: |
          php refapp/bin/simulator.php --scenario=all --seed=13
          php refapp/bin/model-demo.php

      - name: Stop daemon cleanly (SIGINT → flush)
        run: |
          kill -INT "$(cat airgap.pid)" || true
          for i in $(seq 1 20); do
            if ! kill -0 "$(cat airgap.pid)" 2>/dev/null; then
              echo "daemon stopped after ${i} attempts"
              break
            fi
            sleep 0.5
          done
          echo "--- Air-gapped daemon log tail: ---"
          tail -100 airgap-daemon.log || true

      - name: Verify outputs under air-gap (same checks as online integration)
        run: |
          php refapp/bin/verify.php --data-dir=${{ github.workspace }}/airgap-data --tenant=tnt_airgap
          daemon/target/release/athar audit verify ${{ github.workspace }}/airgap-data/audit/segments
          daemon/target/release/athar lifecycle list ${{ github.workspace }}/airgap-data/state/lifecycles.db --open
          daemon/target/release/athar decision recent ${{ github.workspace }}/airgap-data/state/decisions.db --limit 20

      - name: Un-air-gap (restore iptables)
        if: always()
        run: |
          sudo iptables-restore < /tmp/iptables.pre-airgap
          echo "iptables restored"

      - name: Upload air-gap daemon log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: airgap-daemon-log
          path: |
            airgap-daemon.log
            airgap-data/**/*
          if-no-files-found: warn
          retention-days: 7
